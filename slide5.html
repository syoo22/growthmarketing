<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>매체 운영 가이드: Meta</title>
    <link rel="stylesheet" href="style5.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="slide-container">
        <h2 class="slide-title">매체 운영 가이드: Meta</h2>
        
        <div class="accordion-container">
            <div class="accordion-item">
                <input type="checkbox" id="meta-step1" class="acc-input" checked> <label for="meta-step1" class="step-card">
                    <div class="card-header">
                        <div class="step-info">
                            <div class="step-icon">01</div>
                            <div class="header-text">
                                <span class="step-tag">CAMPAIGN</span>
                                <h3>광고 목적 및 예산 설계</h3>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-down arrow-icon"></i>
                    </div>
                    <div class="card-content">
                        <div class="content-inner">
                            <p>• <b>캠페인 목표 선택</b>: 인지도 / 트래픽 / 참여 / <b>잠재 고객</b> / 앱 홍보 / 판매 중 선택</p>
                            <p class="highlight-text">※ 멋사 실전 세팅: 리드 확보를 위해 <b>'잠재 고객 수집'</b> 목표 필수 활용</p>
                            <p>• <b>일 예산 설정</b>: 성과 모니터링 및 즉각 대응이 용이한 <b>'일 단위 예산'</b> 운영 기본</p>
                        </div>
                    </div>
                </label>
            </div>

            <div class="accordion-item">
                <input type="checkbox" id="meta-step2" class="acc-input">
                <label for="meta-step2" class="step-card">
                    <div class="card-header">
                        <div class="step-info">
                            <div class="step-icon">02</div>
                            <div class="header-text">
                                <span class="step-tag">AD SET</span>
                                <h3>타겟 및 상세 최적화</h3>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-down arrow-icon"></i>
                    </div>
                    <div class="card-content">
                        <div class="content-inner">
                            <p>• <b>전환 및 성과</b>: 위치 <b>'웹사이트'</b> / 성과 목표 <b>'잠재 고객 수 극대화'</b> 설정</p>
                            <p>• <b>데이터 세트</b>: <b>'LIKELION 통합 픽셀'</b> 선택 / 이벤트 <b>'요청 제출'</b> 지정</p>
                            <p>• <b>예산 및 일정</b>: 라이브 직후 테스트를 위해 보통 <b>모객 시작 1시간 후</b> 설정 권장</p>
                            <p>• <b>노출 위치</b>: 주로 <b>'Facebook'과 'Instagram'</b> 지면 설정을 권장하며 상황에 따라 조정</p>
                        </div>
                    </div>
                </label>
            </div>

            <div class="accordion-item">
                <input type="checkbox" id="meta-step3" class="acc-input">
                <label for="meta-step3" class="step-card">
                    <div class="card-header">
                        <div class="step-info">
                            <div class="step-icon">03</div>
                            <div class="header-text">
                                <span class="step-tag">AD</span>
                                <h3>소재 구성 및 추적 설정</h3>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-down arrow-icon"></i>
                    </div>
                    <div class="card-content">
                        <div class="content-inner">
                            <p>• <b>대표 계정</b>: <b>FB: 멋쟁이사자처럼 / IG: likelion.official</b> 필수 입력</p>
                            <p>• <b>영상 소재 세팅</b>: 가독성과 CTR 확보를 위해 <b>썸네일 직접 지정</b> 노출</p>
                            <p>• <b>어드밴티지+</b>: 소재 최적화 기능 중 <b>'음악' 기능 추가만 권장</b> (외 취사선택)</p>
                            <p>• <b>추적 설정</b>: 파트너십 광고 <b>'해제'</b> / URL 내 <b>각 소재별 UTM 파라미터</b> 필수 포함</p>
                        </div>
                    </div>
                </label>
            </div>
        </div>

        <div class="title-footer">
            <span>LIKELION GROWTH MARKETING TEAM</span>
        </div>
    </div>
</body>
</html>
