<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style5.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="slide-container">
        <h2 class="slide-title">매체 운영 가이드: Meta</h2>
        
        <div class="accordion-container">
            <input type="checkbox" id="step01" class="acc-input" checked>
            <label for="step01" class="step-card">
                <div class="card-header">
                    <div class="step-info">
                        <div class="step-icon">01</div>
                        <div class="header-text">
                            <span class="step-tag">CAMPAIGN</span>
                            <h3>광고 목적 및 예산 설계</h3>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-down arrow-icon"></i>
                </div>
                <div class="card-content">
                    <div class="content-inner">
                        <p>• <b>캠페인 목표</b>: 6가지 목적 중 <b>'잠재 고객 수집'</b> 필수 활용</p>
                        <p>• <b>예산 설정</b>: 대응이 용이한 <b>'일 단위 예산'</b> 운영 기본</p>
                    </div>
                </div>
            </label>

            <input type="checkbox" id="step02" class="acc-input">
            <label for="step02" class="step-card">
                <div class="card-header">
                    <div class="step-info">
                        <div class="step-icon">02</div>
                        <div class="header-text">
                            <span class="step-tag">AD SET</span>
                            <h3>타겟 및 상세 최적화</h3>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-down arrow-icon"></i>
                </div>
                <div class="card-content">
                    <div class="content-inner">
                        <p>• <b>성과 목표</b>: 위치 <b>'웹사이트'</b> / 목표 <b>'잠재 고객 수 극대화'</b></p>
                        <p>• <b>데이터 세트</b>: <b>'LIKELION 통합 픽셀'</b> / 이벤트 <b>'요청 제출'</b></p>
                        <p>• <b>일정/위치</b>: 모객 1시간 후 예약 / <b>FB&IG 지면</b> 권장</p>
                    </div>
                </div>
            </label>

            <input type="checkbox" id="step03" class="acc-input">
            <label for="step03" class="step-card">
                <div class="card-header">
                    <div class="step-info">
                        <div class="step-icon">03</div>
                        <div class="header-text">
                            <span class="step-tag">AD</span>
                            <h3>소재 구성 및 추적 설정</h3>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-down arrow-icon"></i>
                </div>
                <div class="card-content">
                    <div class="content-inner">
                        <p>• <b>대표 계정</b>: <b>FB 멋쟁이사자처럼 / IG likelion.official</b> 필수</p>
                        <p>• <b>소재 세팅</b>: 영상 <b>썸네일 직접 지정</b> / 음악 외 기능 취사선택</p>
                        <p>• <b>최종 추적</b>: 파트너십 광고 해제 / <b>소재별 UTM 파라미터</b> 필수</p>
                    </div>
                </div>
            </label>
        </div>

        <div class="title-footer">
            <span>LIKELION GROWTH MARKETING TEAM</span>
        </div>
    </div>
</body>
</html>
