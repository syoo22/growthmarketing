<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>매체 운영 가이드: Meta</title>
    <link rel="stylesheet" href="style5.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="slide-container">
        <h2 class="slide-title">매체 운영 가이드<br>Meta (FB/IG) 상세 세팅</h2>
        
        <div class="accordion-container">
            <input type="checkbox" id="step01" class="acc-input" checked>
            <label for="step01" class="step-card">
                <div class="card-header">
                    <div class="step-info">
                        <div class="step-icon">01</div>
                        <div class="header-text">
                            <span class="step-tag">CAMPAIGN</span>
                            <h3>캠페인: 목적 및 예산 설정</h3>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-down arrow-icon"></i>
                </div>
                <div class="card-content">
                    <div class="content-inner">
                        <p class="content-title"><b>[메타의 6가지 캠페인 목표]</b></p>
                        <table class="step-table">
                            <thead>
                                <tr><th>목표</th><th>핵심 설명</th></tr>
                            </thead>
                            <tbody>
                                <tr><td>인지도</td><td>브랜드 기억 가능성이 높은 사람에게 노출</td></tr>
                                <tr><td>트래픽</td><td>웹사이트, 채널 등으로 방문 유도</td></tr>
                                <tr><td>참여</td><td>영상 조회, 메시지, 참여 유도</td></tr>
                                <tr><td>잠재 고객</td><td>양식, 채팅 등을 통한 리드 확보</td></tr>
                                <tr><td>앱 홍보</td><td>앱 설치 및 특정 액션 유도</td></tr>
                                <tr><td>판매</td><td>제품 구매 가능성이 높은 유저 찾기</td></tr>
                            </tbody>
                        </table>
                        <details class="tip-toggle">
                            <summary>💡 멋사 실무 Tip</summary>
                            <div class="tip-content">
                                멋쟁이사자처럼 부트캠프는 지원서 제출 확보를 위해 리드 수집에 최적화된 <b>잠재 고객</b> 목표를 기본으로 사용합니다.
                            </div>
                        </details>
                        <p style="margin-top:15px;">• <b>예산 운영</b>: 성과 변화에 따라 즉시 예산을 조정할 수 있도록 <b>일일 예산</b>을 기본으로 설정합니다.</p>
                    </div>
                </div>
            </label>

            <input type="checkbox" id="step02" class="acc-input">
            <label for="step02" class="step-card">
                <div class="card-header">
                    <div class="step-info">
                        <div class="step-icon">02</div>
                        <div class="header-text">
                            <span class="step-tag">AD SET</span>
                            <h3>광고 세트: 타겟 및 최적화</h3>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-down arrow-icon"></i>
                </div>
                <div class="card-content">
                    <div class="content-inner">
                        <table class="step-table">
                            <thead>
                                <tr><th>설정 항목</th><th>가이드 내용</th></tr>
                            </thead>
                            <tbody>
                                <tr><td>전환 위치</td><td>웹사이트 선택</td></tr>
                                <tr><td>픽셀 설정</td><td>LIKELION 통합 픽셀 확인</td></tr>
                                <tr><td>전환 이벤트</td><td>표준 이벤트 요청 제출 선택</td></tr>
                                <tr><td>노출 위치</td><td>Facebook, Instagram 선택</td></tr>
                            </tbody>
                        </table>
                        <details class="tip-toggle">
                            <summary>💡 멋사 실무 Tip</summary>
                            <div class="tip-content">
                                <b>노출 위치:</b> Facebook과 Instagram 지면 중심으로 운영합니다. 외부 지면인 Audience Network는 <b>OFF</b> 설정을 권장합니다.<br><br>
                                <b>이벤트:</b> 메타 표준 이벤트인 요청 제출은 주로 <b>지원시작</b> 이벤트를 기준으로 설정하여 성과를 추적합니다.
                            </div>
                        </details>
                    </div>
                </div>
            </label>

            <input type="checkbox" id="step03" class="acc-input">
            <label for="step03" class="step-card">
                <div class="card-header">
                    <div class="step-info">
                        <div class="step-icon">03</div>
                        <div class="header-text">
                            <span class="step-tag">AD</span>
                            <h3>광고: 소재 및 데이터 추적</h3>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-down arrow-icon"></i>
                </div>
                <div class="card-content">
                    <div class="content-inner">
                        <table class="step-table">
                            <thead>
                                <tr><th>구성 요소</th><th>체크리스트</th></tr>
                            </thead>
                            <tbody>
                                <tr><td>대표 계정</td><td>FB: 멋쟁이사자처럼 / IG: likelion.official</td></tr>
                                <tr><td>미디어</td><td>영상·이미지 업로드 및 수동 썸네일 지정</td></tr>
                                <tr><td>웹사이트 URL</td><td><b>소재별 UTM 파라미터 포함 링크</b> 필수</td></tr>
                            </tbody>
                        </table>
                        <details class="tip-toggle">
                            <summary>💡 멋사 실무 Tip</summary>
                            <div class="tip-content">
                                성과 분석을 위해 <b>소재별 UTM 파라미터가 포함된 URL</b> 사용은 필수입니다. 행동 유도 버튼은 <b>'지금 신청하기'</b>를 가장 권장합니다.
                            </div>
                        </details>
                    </div>
                </div>
            </label>
        </div>

        <div class="notice-section">
            <div class="notice-header">
                <i class="fa-solid fa-circle-exclamation"></i>
                <h4>필독: 머신러닝 최적화 및 운영 주의사항</h4>
            </div>
            <div class="notice-body">
                <p>• <b>데이터 확보</b>: 일반적으로 7일 이내에 <b>약 50회의 전환 데이터</b>가 쌓여야 안정적인 학습이 가능합니다.</p>
                <p>• <b>수정 주의</b>: 학습 단계에서 예산 변경, 타겟팅 수정, 광고 세트 수정 등 주요 변수 변경은 <b>학습을 다시 초기화</b>시켜 효율 저하를 초래할 수 있습니다.</p>
                <p>• <b>운영 원칙</b>: 학습 기간 동안 충분한 예산과 일관된 설정 유지가 데이터 최적화에 가장 중요합니다.</p>
            </div>
        </div>

        <div class="title-footer">
            <span>LIKELION GROWTH MARKETING TEAM</span>
        </div>
    </div>
</body>
</html>
