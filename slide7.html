<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>매체 운영 가이드: Audience</title>
    <link rel="stylesheet" href="style7.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="slide-container">
        <h2 class="slide-title">매체 운영 가이드<br>오디언스 타겟팅 전략</h2>
        
        <div class="accordion-container">
            <input type="checkbox" id="t_step01" class="acc-input" checked>
            <label for="t_step01" class="step-card">
                <div class="card-header">
                    <div class="step-info">
                        <div class="step-icon">01</div>
                        <div class="header-text">
                            <span class="step-tag">AUDIENCE TYPE</span>
                            <h3>타겟팅 주요 유형 및 활용</h3>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-down arrow-icon"></i>
                </div>
                <div class="card-content">
                    <div class="content-inner">
                        <table class="step-table">
                            <thead>
                                <tr><th>유형</th><th>핵심 내용 및 활용</th></tr>
                            </thead>
                            <tbody>
                                <tr><td><b>맞춤타겟</b></td><td>내부 데이터(DB, 로그) 기반. 전환 예측력 최고</td></tr>
                                <tr><td><b>유사타겟</b></td><td>맞춤타겟과 유사한 패턴 생성 (메타 2%, 구글 2.5% 권장)</td></tr>
                                <tr><td><b>상세타겟</b></td><td>관심사·행동 등 외부 데이터 활용. 신규 유입 확장에 적합</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </label>

            <input type="checkbox" id="t_step02" class="acc-input">
            <label for="t_step02" class="step-card">
                <div class="card-header">
                    <div class="step-info">
                        <div class="step-icon">02</div>
                        <div class="header-text">
                            <span class="step-tag">EXCLUSION</span>
                            <h3>디타겟팅(Exclusion) 전략</h3>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-down arrow-icon"></i>
                </div>
                <div class="card-content">
                    <div class="content-inner">
                        <p>불필요하거나 효율이 낮은 타겟을 제외하여 광고비 낭비를 방지하는 전략입니다.</p>
                        <details class="tip-toggle">
                            <summary>💡 멋사 실무 활용법</summary>
                            <div class="tip-content">
                                <b>이전 기수 수강생</b> 및 <b>지원 완료자 DB</b>를 타겟에서 제외하세요. 중복 노출을 막고 오직 '신규 지원자 유입'에만 예산을 집중할 수 있습니다.
                            </div>
                        </details>
                    </div>
                </div>
            </label>

            <input type="checkbox" id="t_step03" class="acc-input">
            <label for="t_step03" class="step-card">
                <div class="card-header">
                    <div class="step-info">
                        <div class="step-icon">03</div>
                        <div class="header-text">
                            <span class="step-tag">OPTIMIZATION</span>
                            <h3>머신러닝 자동화 및 입찰</h3>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-down arrow-icon"></i>
                </div>
                <div class="card-content">
                    <div class="content-inner">
                        <table class="step-table">
                            <thead>
                                <tr><th>기능</th><th>상세 설명</th></tr>
                            </thead>
                            <tbody>
                                <tr><td><b>어드밴티지+</b></td><td>머신러닝 기반으로 성과가 높은 곳에 자동 확장 노출</td></tr>
                                <tr><td><b>가치 조정</b></td><td>전환 가능성이 높은 조건에 입찰가를 증감하여 최적화</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </label>
        </div>

        <div class="title-footer">
            <span>LIKELION GROWTH MARKETING TEAM</span>
        </div>
    </div>
</body>
</html>
