<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부트캠프 모객 프로세스</title>
    <link rel="stylesheet" href="style3.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="slide-container">
        <h2 class="slide-title">부트캠프 모객 프로세스</h2>
        
        <div class="accordion-container">
            <div class="accordion-item">
                <input type="checkbox" id="step1" class="acc-input">
                <label for="step1" class="step-card">
                    <div class="card-header">
                        <div class="step-info">
                            <div class="step-icon">01</div>
                            <div class="header-text">
                                <span class="step-tag">Preparation</span>
                                <h3>전략 수립 및 리서치</h3>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-down arrow-icon"></i>
                    </div>
                    <div class="card-content">
                        <div class="content-inner">
                            <p>• <b>전략 기획</b>: 킥오프 미팅 및 1·2차 리서치 기반 최종 전략 확정 (그로스/CXP)</p>
                            <p>• <b>스터디</b>: 상세페이지 스터디 및 팀별 전략 공유 (전 팀 참여)</p>
                            <p>• <b>목표 설정</b>: 부트캠프 상세 내용 기반 소구점 도출 및 목표 수립</p>
                        </div>
                    </div>
                </label>
            </div>

            <div class="accordion-item">
                <input type="checkbox" id="step2" class="acc-input">
                <label for="step2" class="step-card">
                    <div class="card-header">
                        <div class="step-info">
                            <div class="step-icon">02</div>
                            <div class="header-text">
                                <span class="step-tag">Creative & Assets</span>
                                <h3>기획 및 제작</h3>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-down arrow-icon"></i>
                    </div>
                    <div class="card-content">
                        <div class="content-inner">
                            <p>• <b>상세페이지</b>: 디자인, 퍼블리싱 및 QA (CXP/브랜드/개발 협업)</p>
                            <p>• <b>인프라 등록</b>: HRD-net 등록 및 사전설명회(유튜브/타입폼) 링크 생성</p>
                            <p>• <b>광고 소재</b>: 캠페인용 광고 소재 기획, 제작 및 최종 공유 (CXP)</p>
                        </div>
                    </div>
                </label>
            </div>

            <div class="accordion-item">
                <input type="checkbox" id="step3" class="acc-input">
                <label for="step3" class="step-card">
                    <div class="card-header">
                        <div class="step-info">
                            <div class="step-icon">03</div>
                            <div class="header-text">
                                <span class="step-tag">Ad-Setting</span>
                                <h3>광고 실행 준비</h3>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-down arrow-icon"></i>
                    </div>
                    <div class="card-content">
                        <div class="content-inner">
                            <p>• <b>미디어 믹스</b>: 이전 기수 회고 및 대행사 RFP 공유를 통한 예산 배분 확정</p>
                            <p>• <b>추적 세팅</b>: UTM 설정, 뷰저블 등록, 빅인 팝업 및 알림톡 세팅 (그로스)</p>
                            <p>• <b>매체 세팅</b>: 타겟 생성, T&D 및 키워드 리스트 작성, 캠페인 기본 세팅</p>
                        </div>
                    </div>
                </label>
            </div>

            <div class="accordion-item">
                <input type="checkbox" id="step4" class="acc-input">
                <label for="step4" class="step-card">
                    <div class="card-header">
                        <div class="step-info">
                            <div class="step-icon">04</div>
                            <div class="header-text">
                                <span class="step-tag">Operation</span>
                                <h3>캠페인 라이브 및 운영</h3>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-down arrow-icon"></i>
                    </div>
                    <div class="card-content">
                        <div class="content-inner">
                            <p>• <b>모객 시작</b>: 전 매체 및 버티컬 매체 최종 점검 후 라이브 실행 (그로스)</p>
                            <p>• <b>모니터링</b>: 데일리 리포트 기반 효율 분석 및 성과 점검 리포팅</p>
                        </div>
                    </div>
                </label>
            </div>

            <div class="accordion-item">
                <input type="checkbox" id="step5" class="acc-input">
                <label for="step5" class="step-card">
                    <div class="card-header">
                        <div class="step-info">
                            <div class="step-icon">05</div>
                            <div class="header-text">
                                <span class="step-tag">Closing & Settlement</span>
                                <h3>캠페인 종료 및 정산</h3>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-down arrow-icon"></i>
                    </div>
                    <div class="card-content">
                        <div class="content-inner">
                            <p>• <b>모객 종료</b>: 캠페인 운영 종료 및 최종 성과 분석 리포트 작성</p>
                            <p>• <b>정산 프로세스</b>: 광고비 정산 및 세금계산서 발행 (brand@likelion.net)</p>
                            <p>• <b>회고</b>: 프로젝트 전체 과정 피드백 및 차기 기수 전략 반영</p>
                        </div>
                    </div>
                </label>
            </div>
        </div>

        <div class="title-footer">
            <span>LIKELION GROWTH MARKETING TEAM</span>
        </div>
    </div>
</body>
</html>
