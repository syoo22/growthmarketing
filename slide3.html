<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부트캠프 모객 프로세스</title>
    <link rel="stylesheet" href="style3.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="slide-container">
        <h2 class="slide-title">부트캠프 모객 프로세스</h2>
        
        <div class="accordion-container">
            <div class="accordion-item">
                <input type="checkbox" id="step1" class="acc-input">
                <label for="step1" class="step-card">
                    <div class="card-header">
                        <div class="step-info">
                            <div class="step-icon">01</div>
                            <div class="header-text">
                                <span class="step-tag">Preparation</span>
                                <h3>전략 수립 및 리서치</h3>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-down arrow-icon"></i>
                    </div>
                    <div class="card-content">
                        <div class="team-info">참여팀: <b>그로스, CXP, ALL</b></div>
                        <div class="content-inner">
                            <p>• <b>전략 기획</b>: 킥오프 미팅 및 1, 2차 리서치 기반 최종 전략 확정</p>
                            <p>• <b>상세페이지 스터디</b>: 상세페이지 스터디 및 팀별 전략 공유 (전 팀 참여)</p>
                            <p>• <b>소구점 및 목표</b>: 교육팀 계획서 바탕 목표 설정 및 소구점 도출</p>
                        </div>
                    </div>
                </label>
            </div>

            <div class="accordion-item">
                <input type="checkbox" id="step2" class="acc-input">
                <label for="step2" class="step-card">
                    <div class="card-header">
                        <div class="step-info">
                            <div class="step-icon">02</div>
                            <div class="header-text">
                                <span class="step-tag">Creative & Assets</span>
                                <h3>기획 및 제작</h3>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-down arrow-icon"></i>
                    </div>
                    <div class="card-content">
                        <div class="team-info">참여팀: <b>CXP, 브랜드, 개발, 교육</b></div>
                        <div class="content-inner">
                            <p>• <b>상세페이지</b>: 상세페이지 기획/디자인/퍼블리싱 및 최종 QA</p>
                            <p>• <b>인프라 등록</b>: HRD-net 등록 및 사전설명회 링크(유튜브, 타입폼) 생성</p>
                            <p>• <b>광고 소재</b>: 캠페인 운영을 위한 광고 소재 기획 및 제작</p>
                            <p>• <b>기타 세팅</b>: 어드민 내 공유하기 설정, 문의 링크 생성 요청</p>
                        </div>
                    </div>
                </label>
            </div>

            <div class="accordion-item">
                <input type="checkbox" id="step3" class="acc-input">
                <label for="step3" class="step-card">
                    <div class="card-header">
                        <div class="step-info">
                            <div class="step-icon">03</div>
                            <div class="header-text">
                                <span class="step-tag">Ad-Setting</span>
                                <h3>캠페인 실행 준비</h3>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-down arrow-icon"></i>
                    </div>
                    <div class="card-content">
                        <div class="team-info">참여팀: <b>그로스, CXP</b></div>
                        <div class="content-inner">
                            <p>• <b>미디어 믹스</b>: 이전 기수 회고 및 대행사 RFP 공유를 통한 매체 구조 확정</p>
                            <p>• <b>추적/분석 세팅</b>: UTM 설정, 뷰저블 등록, 빅인 팝업 및 알림톡 세팅</p>
                            <p>• <b>매체 세팅</b>: 타겟 생성(방문, 지원 등), T&D 작성, 키워드 리스트 및 캠페인 기본 세팅</p>
                        </div>
                    </div>
                </label>
            </div>

            <div class="accordion-item">
                <input type="checkbox" id="step4" class="acc-input">
                <label for="step4" class="step-card">
                    <div class="card-header">
                        <div class="step-info">
                            <div class="step-icon">04</div>
                            <div class="header-text">
                                <span class="step-tag">Operation</span>
                                <h3>캠페인 라이브 및 운영</h3>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-down arrow-icon"></i>
                    </div>
                    <div class="card-content">
                        <div class="team-info">참여팀: <b>그로스</b></div>
                        <div class="content-inner">
                            <p>• <b>모객 시작</b>: 전 매체 및 버티컬 매체 최종 점검 후 캠페인 라이브</p>
                            <p>• <b>성과 모니터링</b>: 데일리 리포트 기반 전환 효율 분석 및 성과 점검</p>
                        </div>
                    </div>
                </label>
            </div>

            <div class="accordion-item">
                <input type="checkbox" id="step5" class="acc-input">
                <label for="step5" class="step-card">
                    <div class="card-header">
                        <div class="step-info">
                            <div class="step-icon">05</div>
                            <div class="header-text">
                                <span class="step-tag">Closing & Settlement</span>
                                <h3>종료 및 정산</h3>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-down arrow-icon"></i>
                    </div>
                    <div class="card-content">
                        <div class="team-info">참여팀: <b>그로스</b></div>
                        <div class="content-inner">
                            <p>• <b>모객 종료</b>: 캠페인 운영 종료 및 데이터 취합</p>
                            <p>• <b>최종 정산</b>: 종료월 말일에 세금계산서 발행 및 최종 정산</p>
                        </div>
                    </div>
                </label>
            </div>
        </div>

        <div class="title-footer">
            <span>LIKELION GROWTH MARKETING TEAM</span>
        </div>
    </div>
</body>
</html>
